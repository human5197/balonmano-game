<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balonmano 3D</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #0d1117; height: 100%; }
      #app { position: relative; width: 100vw; height: 100vh; }
      canvas { display: block; }
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 16px;
        box-sizing: border-box;
        color: #ffffff;
        font-family: system-ui, sans-serif;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      }
      #hud .score { font-size: 24px; font-weight: 700; }
      #hud .hint { font-size: 14px; opacity: 0.85; margin-top: 4px; }
      #hud .message { font-size: 18px; margin-top: 8px; min-height: 22px; }
      #pass-icons { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
      .pass-icon {
        position: absolute;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        background: rgba(255, 221, 51, 0.92);
        border: 2px solid #fff;
        color: #1a1300;
        font-family: system-ui, sans-serif;
        font-weight: 800;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        visibility: hidden;
        pointer-events: auto;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div class="score" id="score">Goles: 0</div>
        <div class="hint">
          WASD/flechas: mover · Click en un compañero o pulsa su número: pasarle el balón · Click en el campo: lanzar ahí ·
          Tab: cambiar de jugador · Click derecho en compañero + campo: darle una posición
        </div>
        <div class="message" id="message"></div>
      </div>
      <div id="pass-icons"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
